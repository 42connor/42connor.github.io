<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Connor Hood — share card</title>
<!--
  Source for og-card.png. Rendered at exactly 1200x630, the Open Graph card
  size, and committed so the image can be rebuilt rather than reverse
  engineered. See the README for the one command that regenerates it.
-->
<style>
    @font-face {
        font-family: 'Cormorant Garamond';
        font-style: normal; font-weight: 300 700;
        src: url(../fonts/cormorant-garamond.woff2) format('woff2');
    }
    @font-face {
        font-family: 'Cormorant Garamond';
        font-style: italic; font-weight: 300 700;
        src: url(../fonts/cormorant-garamond-italic.woff2) format('woff2');
    }
    @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal; font-weight: 100 800;
        src: url(../fonts/jetbrains-mono.woff2) format('woff2');
    }

    :root {
        --paper: #f5efe1;
        --ink: #2a2520;
        --ink-soft: #6a5e51;
        --gold: #a87a2b;
        --gold-soft: #c9a55b;
        --rule: #d8cdb4;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { width: 1200px; height: 630px; overflow: hidden; }

    body {
        background: var(--paper);
        font-family: 'JetBrains Mono', monospace;
        color: var(--ink);
        position: relative;
        display: grid;
        grid-template-columns: 260px 1fr;
        align-items: center;
        gap: 62px;
        padding: 0 96px;
    }

    /* Same ambient wash as the site, so the card and the page feel like one. */
    .amb {
        position: absolute; inset: 0; z-index: 0; pointer-events: none;
        background:
            radial-gradient(ellipse at 14% 18%, rgba(168,122,43,0.10), transparent 55%),
            radial-gradient(ellipse at 88% 82%, rgba(168,122,43,0.08), transparent 55%),
            radial-gradient(ellipse at 50% 50%, rgba(255,248,230,0.45), transparent 70%);
    }

    .sprigs { position: absolute; inset: 0; z-index: 1; pointer-events: none; }

    .portrait, .ident { position: relative; z-index: 2; }

    .portrait {
        width: 260px; height: 260px;
        border-radius: 50%;
        object-fit: cover;
        border: 1px solid var(--gold);
        box-shadow: 0 0 0 8px var(--paper), 0 0 0 9px var(--rule);
    }

    h1 {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 92px; font-weight: 600;
        line-height: 1.0; letter-spacing: -0.01em;
        margin-bottom: 20px;
    }

    .title {
        font-size: 20px; font-weight: 500;
        text-transform: uppercase; letter-spacing: 0.2em;
        color: var(--ink-soft);
    }

    .rule { margin: 30px 0 26px; color: var(--gold); opacity: 0.6; font-size: 20px; letter-spacing: 0.15em; }

    .blurb {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-style: italic; font-size: 30px; line-height: 1.45;
        color: var(--ink-soft); max-width: 660px;
    }

    .url {
        position: absolute; bottom: 44px; left: 96px; z-index: 2;
        font-size: 18px; letter-spacing: 0.06em; color: var(--gold);
    }
    .url::before { content: "$ "; color: var(--ink-soft); opacity: 0.55; }
</style>
</head>
<body>
    <div class="amb"></div>

    <!-- Hand-drawn echo of the generative marginalia in hero.js: a curving
         stem with almond leaves alternating up it. -->
    <svg class="sprigs" viewBox="0 0 1200 630" fill="none">
        <g stroke="var(--gold)" stroke-width="2.2" stroke-linecap="round" opacity="0.8">
            <path d="M1108 596c14-40 2-84 16-126s2-70 14-104"/>
            <path d="M62 44c-12 34-2 66-14 98"/>
        </g>
        <g fill="var(--gold)" opacity="0.78">
            <g transform="translate(1118,540) rotate(-46)"><path d="M0 0Q18-11 44 0Q18 11 0 0Z"/></g>
            <g transform="translate(1112,478) rotate(44)"><path d="M0 0Q16-10 40 0Q16 10 0 0Z"/></g>
            <g transform="translate(1126,414) rotate(-42)"><path d="M0 0Q15-9 36 0Q15 9 0 0Z"/></g>
            <g transform="translate(1122,356) rotate(40)"><path d="M0 0Q13-8 30 0Q13 8 0 0Z"/></g>
            <circle cx="1136" cy="312" r="5"/>
            <g transform="translate(56,86) rotate(214)"><path d="M0 0Q15-9 36 0Q15 9 0 0Z"/></g>
            <g transform="translate(50,132) rotate(128)"><path d="M0 0Q13-8 30 0Q13 8 0 0Z"/></g>
        </g>
        <g stroke="var(--gold)" stroke-width="1.6" stroke-linecap="round" opacity="0.55">
            <path d="M1040 220v26M1027 233h26"/>
            <path d="M150 520v20M140 530h20"/>
            <path d="M1072 92v16M1064 100h16"/>
        </g>
    </svg>

    <img class="portrait" src="../img/profile-390.jpg" alt="">

    <div class="ident">
        <h1>Connor Hood</h1>
        <p class="title">AI Specialist &middot; ML Datasets &middot; Full Stack</p>
        <p class="rule">════</p>
        <p class="blurb">
            ML datasets, vision-language-action models, and full stack web
            development &mdash; with hands-on production experience behind it.
        </p>
    </div>

    <p class="url">42connor.github.io</p>
</body>
</html>
