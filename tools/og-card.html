<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Connor Hood — share card</title>
<!--
  Source for og-card.png. Rendered at exactly 1200x630, the Open Graph card
  size, and committed so the image can be rebuilt rather than reverse
  engineered. See the README for the one command that regenerates it.
-->
<style>
    @font-face {
        font-family: 'Cormorant Garamond';
        font-style: normal; font-weight: 300 700;
        src: url(../fonts/cormorant-garamond.woff2) format('woff2');
    }
    @font-face {
        font-family: 'Cormorant Garamond';
        font-style: italic; font-weight: 300 700;
        src: url(../fonts/cormorant-garamond-italic.woff2) format('woff2');
    }
    @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal; font-weight: 100 800;
        src: url(../fonts/jetbrains-mono.woff2) format('woff2');
    }

    :root {
        --paper: #f5efe1;
        --ink: #2a2520;
        --ink-soft: #6a5e51;
        --gold: #a87a2b;
        --gold-soft: #c9a55b;
        --rule: #d8cdb4;
        --rose: #c2707a;
        --blush: #e2b0b3;
        --sage: #869176;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { width: 1200px; height: 630px; overflow: hidden; }

    body {
        background: var(--paper);
        font-family: 'JetBrains Mono', monospace;
        color: var(--ink);
        position: relative;
        display: grid;
        grid-template-columns: 260px 1fr;
        align-items: center;
        gap: 62px;
        padding: 0 96px;
    }

    /* Same ambient wash as the site, so the card and the page feel like one. */
    .amb {
        position: absolute; inset: 0; z-index: 0; pointer-events: none;
        background:
            radial-gradient(ellipse at 14% 18%, rgba(168,122,43,0.10), transparent 55%),
            radial-gradient(ellipse at 88% 82%, rgba(168,122,43,0.08), transparent 55%),
            radial-gradient(ellipse at 50% 50%, rgba(255,248,230,0.45), transparent 70%);
    }

    .sprigs { position: absolute; inset: 0; z-index: 1; pointer-events: none; }

    .portrait, .ident { position: relative; z-index: 2; }

    .portrait {
        width: 260px; height: 260px;
        border-radius: 50%;
        object-fit: cover;
        border: 1px solid var(--gold);
        box-shadow: 0 0 0 8px var(--paper), 0 0 0 9px var(--rule);
    }

    h1 {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 92px; font-weight: 600;
        line-height: 1.0; letter-spacing: -0.01em;
        margin-bottom: 20px;
    }

    .title {
        font-size: 20px; font-weight: 500;
        text-transform: uppercase; letter-spacing: 0.2em;
        color: var(--ink-soft);
    }

    .rule { margin: 30px 0 26px; color: var(--gold); opacity: 0.6; font-size: 20px; letter-spacing: 0.15em; }

    .blurb {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-style: italic; font-size: 30px; line-height: 1.45;
        color: var(--ink-soft); max-width: 660px;
    }

    .url {
        position: absolute; bottom: 44px; left: 96px; z-index: 2;
        font-size: 18px; letter-spacing: 0.06em; color: var(--gold);
    }
    .url::before { content: "$ "; color: var(--ink-soft); opacity: 0.55; }
</style>
</head>
<body>
    <div class="amb"></div>

    <!-- Hand-drawn echo of the generative marginalia in hero.js: a curving
         stem with almond leaves alternating up it. -->
    <svg class="sprigs" viewBox="0 0 1200 630" fill="none">
        <defs>
          <g id="bloom">
            <g fill="var(--sage)" opacity="0.55">
              <path transform="rotate(132)" d="M0 0C7-4.5 7-20 0-25C-7-20-7-4.5 0 0Z"/>
              <path transform="rotate(-132)" d="M0 0C7-4.5 7-20 0-25C-7-20-7-4.5 0 0Z"/>
            </g>
            <g fill="var(--blush)" opacity="0.92">
            <path transform="rotate(0.0)" d="M0 0C8.4-4 8.4-19.5 0-24C-8.4-19.5-8.4-4 0 0Z"/>
            <path transform="rotate(45.0)" d="M0 0C8.4-4 8.4-19.5 0-24C-8.4-19.5-8.4-4 0 0Z"/>
            <path transform="rotate(90.0)" d="M0 0C8.4-4 8.4-19.5 0-24C-8.4-19.5-8.4-4 0 0Z"/>
            <path transform="rotate(135.0)" d="M0 0C8.4-4 8.4-19.5 0-24C-8.4-19.5-8.4-4 0 0Z"/>
            <path transform="rotate(180.0)" d="M0 0C8.4-4 8.4-19.5 0-24C-8.4-19.5-8.4-4 0 0Z"/>
            <path transform="rotate(225.0)" d="M0 0C8.4-4 8.4-19.5 0-24C-8.4-19.5-8.4-4 0 0Z"/>
            <path transform="rotate(270.0)" d="M0 0C8.4-4 8.4-19.5 0-24C-8.4-19.5-8.4-4 0 0Z"/>
            <path transform="rotate(315.0)" d="M0 0C8.4-4 8.4-19.5 0-24C-8.4-19.5-8.4-4 0 0Z"/>
            </g>
            <g fill="var(--rose)" opacity="0.85">
            <path transform="rotate(25.7)" d="M0 0C5.6-2.6 5.6-12.6 0-15.5C-5.6-12.6-5.6-2.6 0 0Z"/>
            <path transform="rotate(77.1)" d="M0 0C5.6-2.6 5.6-12.6 0-15.5C-5.6-12.6-5.6-2.6 0 0Z"/>
            <path transform="rotate(128.6)" d="M0 0C5.6-2.6 5.6-12.6 0-15.5C-5.6-12.6-5.6-2.6 0 0Z"/>
            <path transform="rotate(180.0)" d="M0 0C5.6-2.6 5.6-12.6 0-15.5C-5.6-12.6-5.6-2.6 0 0Z"/>
            <path transform="rotate(231.4)" d="M0 0C5.6-2.6 5.6-12.6 0-15.5C-5.6-12.6-5.6-2.6 0 0Z"/>
            <path transform="rotate(282.8)" d="M0 0C5.6-2.6 5.6-12.6 0-15.5C-5.6-12.6-5.6-2.6 0 0Z"/>
            <path transform="rotate(334.3)" d="M0 0C5.6-2.6 5.6-12.6 0-15.5C-5.6-12.6-5.6-2.6 0 0Z"/>
            </g>
            <circle r="5.6" fill="var(--gold)"/>
            <circle r="2.4" fill="var(--gold-soft)"/>
          </g>
        </defs>

        <!-- Stems, drawn to match the sage sprigs hero.js grows in the margins. -->
        <g stroke="var(--sage)" stroke-width="2.4" stroke-linecap="round" opacity="0.75">
            <path d="M1112 604c14-42 0-88 14-132s2-72 14-108"/>
            <path d="M1058 612c8-30 22-56 26-88"/>
            <path d="M58 30c-12 36 0 70-14 104"/>
        </g>

        <!-- Sage leaves up the stems. -->
        <g fill="var(--sage)" opacity="0.6">
            <g transform="translate(1120,548) rotate(-46)"><path d="M0 0Q18-11 44 0Q18 11 0 0Z"/></g>
            <g transform="translate(1114,486) rotate(44)"><path d="M0 0Q16-10 40 0Q16 10 0 0Z"/></g>
            <g transform="translate(1128,420) rotate(-42)"><path d="M0 0Q15-9 36 0Q15 9 0 0Z"/></g>
            <g transform="translate(1068,570) rotate(48)"><path d="M0 0Q14-9 34 0Q14 9 0 0Z"/></g>
            <g transform="translate(50,74) rotate(214)"><path d="M0 0Q15-9 36 0Q15 9 0 0Z"/></g>
            <g transform="translate(44,124) rotate(128)"><path d="M0 0Q13-8 30 0Q13 8 0 0Z"/></g>
        </g>

        <!-- Blooms crowning the stems, plus one loose. -->
        <use href="#bloom" transform="translate(1140,300) rotate(12) scale(1.15)"/>
        <use href="#bloom" transform="translate(1082,516) rotate(-24) scale(0.72)"/>
        <use href="#bloom" transform="translate(38,152) rotate(196) scale(0.86)"/>
        <use href="#bloom" transform="translate(1176,432) rotate(40) scale(0.5)"/>

        <!-- Gold sparkles. -->
        <g stroke="var(--gold)" stroke-width="1.7" stroke-linecap="round" opacity="0.55">
            <path d="M1016 200v26M1003 213h26"/>
            <path d="M150 520v20M140 530h20"/>
            <path d="M1040 90v16M1032 98h16"/>
            <path d="M112 372v18M103 381h18"/>
        </g>
    </svg>

    <img class="portrait" src="../img/profile-390.jpg" alt="">

    <div class="ident">
        <h1>Connor Hood</h1>
        <p class="title">AI Systems Engineer &middot; Agentic Automation</p>
        <p class="rule">════</p>
        <p class="blurb">
            Agentic AI on live financial and scientific data &mdash; plus ML
            datasets and hands-on production experience behind it.
        </p>
    </div>

    <p class="url">42connor.github.io</p>
</body>
</html>
